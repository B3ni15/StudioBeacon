appId: com.studiobeacon.app
productName: Studio Beacon
copyright: Copyright © 2026
asar: true
npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../plugin/dist/StudioBeacon.rbxmx
    to: StudioBeacon.rbxmx
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: build/tray.png
    to: tray.png
  - from: build/tray@2x.png
    to: tray@2x.png

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - dmg
    - zip

win:
  icon: build/icon.png
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  icon: build/icon.png
  target:
    - AppImage
    - deb

artifactName: ${productName}-${version}-${os}-${arch}.${ext}
