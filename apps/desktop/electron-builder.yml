appId: com.studiobeacon.app
productName: Studio Beacon
copyright: Copyright © 2026 Studio Beacon contributors
asar: true
npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../plugin/dist/StudioBeacon.rbxmx
    to: StudioBeacon.rbxmx
  - from: build/trayTemplate.png
    to: trayTemplate.png
  - from: build/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: build/tray.png
    to: tray.png
  - from: build/tray@2x.png
    to: tray@2x.png

# GitHub Releases feed used by electron-updater.
publish:
  provider: github
  owner: B3ni15
  repo: StudioBeacon

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  icon: build/icon.png
  target:
    - AppImage
    - deb

artifactName: studio-beacon-${version}-${os}-${arch}.${ext}
